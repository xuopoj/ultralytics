# VOC2012 Dataset Config
#
# ── Usage ──────────────────────────────────────────────────────────────────────
# 'path' is a dataset field — set it directly in this file (see below).
# It cannot be overridden on the CLI (not a valid yolo train argument).
#
# Train:
#   yolo train cfg=train_detect_template.yaml data=my_voc2012.yaml
#
# On Ascend NPU (requires torch_npu + CANN toolkit):
#   Single NPU:
#     yolo train cfg=train_detect_template.yaml data=my_voc2012.yaml device=npu
#   Multi-NPU DDP (hccl backend, ultralytics spawns torchrun internally):
#     yolo train cfg=train_detect_template.yaml data=my_voc2012.yaml device=npu:0,npu:1
#
# Validation:
#   yolo val model=runs/detect/exp/weights/best.pt data=my_voc2012.yaml device=npu
#
# Export to ONNX (after training):
#   yolo export model=runs/detect/exp/weights/best.pt format=onnx opset=12 simplify=True
#
# Python API:
#   from ultralytics import YOLO
#   model = YOLO("runs/detect/exp/weights/best.pt")
#   model.train(data="my_voc2012.yaml", device="npu:0,npu:1")
#
# First run: the 'download' script below runs automatically to convert VOC XML
# annotations → YOLO .txt labels. Subsequent runs skip already-converted files.
# ───────────────────────────────────────────────────────────────────────────────
#
# Expected layout under <path>/:
#   VOC2012/
#     Annotations/      ← XML label files
#     ImageSets/Main/   ← train.txt, val.txt, trainval.txt
#     JPEGImages/       ← .jpg images
#   images/
#     train2012/        ← populated by convert script below
#     val2012/
#   labels/
#     train2012/        ← YOLO .txt labels written by convert script
#     val2012/

path: /home/ma-user/modelarts/inputs/YOLO_0/datasets
train: images/train2012
val: images/val2012

# Classes (all 20 standard VOC classes)
names:
  0: aeroplane
  1: bicycle
  2: bird
  3: boat
  4: bottle
  5: bus
  6: car
  7: cat
  8: chair
  9: cow
  10: diningtable
  11: dog
  12: horse
  13: motorbike
  14: person
  15: pottedplant
  16: sheep
  17: sofa
  18: train
  19: tvmonitor

# Label conversion script — runs automatically on first `yolo train data=my_voc2012.yaml`
# Converts VOC XML annotations → YOLO xywh .txt format, then moves images into place.
download: |
  import xml.etree.ElementTree as ET
  from pathlib import Path
  from ultralytics.utils import TQDM

  def convert_box(size, box):
      """Convert VOC (xmin,xmax,ymin,ymax) to YOLO (cx,cy,w,h) normalized."""
      dw, dh = 1.0 / size[0], 1.0 / size[1]
      cx = (box[0] + box[1]) / 2.0 - 1
      cy = (box[2] + box[3]) / 2.0 - 1
      w  = box[1] - box[0]
      h  = box[3] - box[2]
      return cx * dw, cy * dh, w * dw, h * dh

  def convert_label(devkit_path, lb_path, year, image_id, class_names):
      """Parse one VOC XML file and write a YOLO .txt label."""
      xml_file = devkit_path / f"VOC{year}/Annotations/{image_id}.xml"
      tree = ET.parse(xml_file)
      root = tree.getroot()
      size = root.find("size")
      w = int(size.find("width").text)
      h = int(size.find("height").text)

      lines = []
      for obj in root.iter("object"):
          cls = obj.find("name").text
          if cls not in class_names or int(obj.find("difficult").text) == 1:
              continue
          xmlbox = obj.find("bndbox")
          coords = [float(xmlbox.find(t).text) for t in ("xmin", "xmax", "ymin", "ymax")]
          bb = convert_box((w, h), coords)
          lines.append(f"{class_names.index(cls)} {' '.join(f'{v:.6f}' for v in bb)}")

      lb_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

  root_dir   = Path(yaml["path"])
  devkit     = root_dir 
  class_names = list(yaml["names"].values())

  for year, split in [("2012", "train"), ("2012", "val")]:
      imgs_out = root_dir / "images"  / f"{split}{year}"
      lbs_out  = root_dir / "labels" / f"{split}{year}"
      imgs_out.mkdir(parents=True, exist_ok=True)
      lbs_out.mkdir(parents=True, exist_ok=True)

      image_set_file = devkit / f"VOC{year}/ImageSets/Main/{split}.txt"
      image_ids = image_set_file.read_text(encoding="utf-8").strip().split()

      for img_id in TQDM(image_ids, desc=f"Converting VOC{year} {split}"):
          src_img = devkit / f"VOC{year}/JPEGImages/{img_id}.jpg"
          dst_img = imgs_out / f"{img_id}.jpg"
          lb_path = lbs_out  / f"{img_id}.txt"

          if not dst_img.exists():
              import shutil
              shutil.copy2(src_img, dst_img)   # copy; original stays intact

          if not lb_path.exists():
              convert_label(devkit, lb_path, year, img_id, class_names)